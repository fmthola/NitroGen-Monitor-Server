# SonarQube analysis config.
#
# No secrets or environment-specific values are stored here:
#   - the server URL and analysis token come from the local credential store
#     (KWallet) at scan time, supplied via SONAR_HOST_URL / SONAR_TOKEN.

sonar.projectKey=nitrogen-monitor-server-bazzite
sonar.projectName=NitroGen Monitor & Server (Bazzite Port)
sonar.projectVersion=1.1.0

# Python product code lives in the package and the entry-point scripts.
sonar.sources=nitrogen,scripts

# Unit tests are analysed as test code, not product code.
sonar.tests=tests
sonar.test.inclusions=tests/**

# Non-code and generated paths are excluded from analysis.
sonar.exclusions=**/__pycache__/**,**/venv/**,**/models/**,**/out/**,**/corrections/**,**/docs/**,**/*.pyc

# Coverage report (generated by running tests under coverage.py).
sonar.python.coverage.reportPaths=coverage.xml

# Coverage exclusions: the capture/gamepad-output/game-loop/model/training code is
# hardware- and game-exercised, not unit-testable. Coverage is measured on the
# testable pure logic (the uinput gamepad mapping, covered by tests/).
sonar.coverage.exclusions=scripts/**,nitrogen/linux_capture.py,nitrogen/linux_capture_pipewire.py,nitrogen/linux_window.py,nitrogen/inference_session.py,nitrogen/inference_client.py,nitrogen/inference_viz.py,nitrogen/game_env.py,nitrogen/mm_tokenizers.py,nitrogen/cfg.py,nitrogen/shared.py,nitrogen/flow_matching_transformer/**

sonar.python.version=3.10, 3.11, 3.12, 3.13, 3.14

sonar.sourceEncoding=UTF-8
