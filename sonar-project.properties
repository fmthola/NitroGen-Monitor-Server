# SonarQube analysis config.
#
# No secrets or environment-specific values are stored here:
#   - the server URL and analysis token come from the local credential store
#     (KWallet) at scan time, supplied via SONAR_HOST_URL / SONAR_TOKEN.

sonar.projectKey=nitrogen-monitor-server-bazzite
sonar.projectName=NitroGen Monitor & Server (Bazzite Port)
sonar.projectVersion=1.0.0

# Python product code lives in the package and the entry-point scripts.
sonar.sources=nitrogen,scripts

sonar.exclusions=**/__pycache__/**,**/venv/**,**/models/**,**/out/**,**/*.pyc

sonar.python.version=3.10, 3.11, 3.12

sonar.sourceEncoding=UTF-8
